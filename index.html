<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1f2024" />
    <meta name="description" content="Termo — descubra a palavra certa em 6 tentativas." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Termo</title>
    <script>
      // Aplica o tema antes da primeira pintura para não piscar o tema errado.
      // Mesma regra de src/utils/theme.ts: escolha salva ou, sem ela, o sistema.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("termo:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          var prefersLight =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          theme = prefersLight ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        if (theme === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f3f1ec");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
